<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- 🔤 Google Fonts: Montserrat (Norwester se sirve local) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Norwester no trae tildes, Ñ ni ¿¡: Fjalla One cubre solo esos caracteres (ÁÉÍÓÚÑÜáéíóúñü¿¡) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fjalla+One&text=%C3%81%C3%89%C3%8D%C3%93%C3%9A%C3%91%C3%9C%C3%A1%C3%A9%C3%AD%C3%B3%C3%BA%C3%B1%C3%BC%C2%BF%C2%A1&display=swap"
      rel="stylesheet"
    />

    <!-- Ícono del navegador -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- SEO básico -->
    <meta
      name="description"
      content="Portafolio de Lucas Salazar, desarrollador fullstack: productos SaaS, sistemas POS y plataformas operativas con React, Next.js, NestJS y PostgreSQL."
    />
    <meta name="author" content="Lucas Salazar" />
    <!-- Igual al color superior de la página para que la barra de estado se funda -->
    <meta name="theme-color" content="#141c2e" />

    <!-- Vista previa al compartir el enlace (WhatsApp, LinkedIn, etc.).
         La imagen debe ir con URL absoluta; se regenera desde scripts/og-image.html -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lucas Salazar" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:url" content="https://lucas-salazar-portfolio.vercel.app/" />
    <meta property="og:title" content="Lucas Salazar | Fullstack Developer" />
    <meta
      property="og:description"
      content="Productos SaaS, sistemas POS y plataformas operativas con React, Next.js, NestJS y PostgreSQL."
    />
    <meta
      property="og:image"
      content="https://lucas-salazar-portfolio.vercel.app/og-image.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Lucas Salazar, Fullstack Developer. Productos SaaS y sistemas reales."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lucas Salazar | Fullstack Developer" />
    <meta
      name="twitter:description"
      content="Productos SaaS, sistemas POS y plataformas operativas con React, Next.js, NestJS y PostgreSQL."
    />
    <meta
      name="twitter:image"
      content="https://lucas-salazar-portfolio.vercel.app/og-image.jpg"
    />
    <link rel="canonical" href="https://lucas-salazar-portfolio.vercel.app/" />

    <!-- Título del sitio -->
    <title>Lucas Salazar | Fullstack Developer</title>
  </head>

  <body>
    <div id="root"></div>

    <!-- React/Vite script principal -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
